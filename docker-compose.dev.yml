services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: maxkb-postgres
    restart: always
    environment:
      POSTGRES_DB: maxkb
      POSTGRES_USER: maxkb
      POSTGRES_PASSWORD: maxkb123
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxkb -d maxkb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: maxkb-redis
    restart: always
    command: ["redis-server", "--requirepass", "maxkb123"]
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a maxkb123 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
