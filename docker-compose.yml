services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg17}
    container_name: maxkb-postgres
    restart: always
    environment:
      POSTGRES_DB: ${MAXKB_DB_NAME}
      POSTGRES_USER: ${MAXKB_DB_USER}
      POSTGRES_PASSWORD: ${MAXKB_DB_PASSWORD}
    volumes:
      - maxkb_pg:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAXKB_DB_USER} -d ${MAXKB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - maxkb

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: maxkb-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MAXKB_REDIS_PASSWORD}"]
    volumes:
      - maxkb_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${MAXKB_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - maxkb

  maxkb-init:
    build:
      context: .
      dockerfile: Dockerfile.app
      network: host
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    image: maxkb-app:local
    profiles: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - maxkb_data:/opt/maxkb
      - maxkb_static:/opt/maxkb-app/apps/static
    command:
      - sh
      - -lc
      - >
        python /opt/maxkb-app/apps/manage.py collectstatic --noinput -c &&
        python /opt/maxkb-app/apps/manage.py migrate
    networks:
      - maxkb

  maxkb-web:
    build:
      context: .
      dockerfile: Dockerfile.app
      network: host
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    image: maxkb-app:local
    container_name: maxkb-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - maxkb_data:/opt/maxkb
      - maxkb_static:/opt/maxkb-app/apps/static
    command:
      - sh
      - -lc
      - >
        python /opt/maxkb-app/apps/manage.py collectstatic --noinput -c &&
        python /opt/maxkb-app/apps/manage.py start web
    expose:
      - "8080"
    networks:
      - maxkb

  maxkb-task:
    image: maxkb-app:local
    container_name: maxkb-task
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - maxkb_data:/opt/maxkb
    command: ["python", "/opt/maxkb-app/apps/manage.py", "start", "task"]
    networks:
      - maxkb

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    container_name: maxkb-nginx
    restart: always
    depends_on:
      - maxkb-web
    ports:
      - "${MAXKB_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx/conf.d/maxkb.conf:/etc/nginx/conf.d/default.conf:ro
      - maxkb_static:/opt/maxkb-static:ro
    networks:
      - maxkb

networks:
  maxkb:

volumes:
  maxkb_pg:
  maxkb_redis:
  maxkb_data:
  maxkb_static:
