name: CI

on:
  push:
    branches: [main, master, v2]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, master, v2]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maxkb
          POSTGRES_PASSWORD: maxkb123
          POSTGRES_DB: maxkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAXKB_CONFIG_TYPE: ENV
      MAXKB_DB_NAME: maxkb
      MAXKB_DB_HOST: 127.0.0.1
      MAXKB_DB_PORT: 5432
      MAXKB_DB_USER: maxkb
      MAXKB_DB_PASSWORD: maxkb123
      MAXKB_DB_ENGINE: dj_db_conn_pool.backends.postgresql
      MAXKB_DB_MAX_OVERFLOW: 80
      MAXKB_REDIS_HOST: 127.0.0.1
      MAXKB_REDIS_PORT: 6379
      MAXKB_REDIS_PASSWORD: ''
      MAXKB_REDIS_DB: 0
      MAXKB_REDIS_MAX_CONNECTIONS: 100
      MAXKB_SECRET_KEY: ci-django-secret-key
      MAXKB_HMAC_SIGNED_SERIALIZER_SECRET_KEY: ci-hmac-secret-key
      MAXKB_RSA_PASSPHRASE: ci-rsa-passphrase
      MAXKB_DEFAULT_PASSWORD: TestPassword123!
      MAXKB_DEBUG: False
      MAXKB_LOG_DIR: /tmp/maxkb/logs
      MAXKB_CELERY_DATA_DIR: /tmp/maxkb/celery_task
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0

      - name: Install dependencies
        run: |
          uv venv .venv
          . .venv/bin/activate
          python - <<'PY' > /tmp/maxkb-requirements.txt
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('pyproject.toml').read_text())
          for dependency in data['project']['dependencies']:
              print(dependency)
          PY
          uv pip install -r /tmp/maxkb-requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p /tmp/maxkb/logs /tmp/maxkb/celery_task

      - name: Enable pgvector for test databases
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os
          import psycopg

          common = {
              'host': os.environ['MAXKB_DB_HOST'],
              'port': os.environ['MAXKB_DB_PORT'],
              'user': os.environ['MAXKB_DB_USER'],
              'password': os.environ['MAXKB_DB_PASSWORD'],
          }

          for dbname in ('postgres', 'template1', 'maxkb'):
              with psycopg.connect(dbname=dbname, autocommit=True, **common) as conn:
                  conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY

      - name: Run backend test suite
        run: |
          . .venv/bin/activate
          python apps/manage.py test --verbosity=1 --noinput

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm install

      - name: Type check
        working-directory: ui
        run: npm run type-check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: ui
        run: npm run test

  e2e-tests:
    name: E2E Tests (Advisory)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maxkb
          POSTGRES_PASSWORD: maxkb123
          POSTGRES_DB: maxkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAXKB_CONFIG_TYPE: ENV
      MAXKB_DB_NAME: maxkb
      MAXKB_DB_HOST: 127.0.0.1
      MAXKB_DB_PORT: 5432
      MAXKB_DB_USER: maxkb
      MAXKB_DB_PASSWORD: maxkb123
      MAXKB_DB_ENGINE: dj_db_conn_pool.backends.postgresql
      MAXKB_DB_MAX_OVERFLOW: 80
      MAXKB_REDIS_HOST: 127.0.0.1
      MAXKB_REDIS_PORT: 6379
      MAXKB_REDIS_PASSWORD: ''
      MAXKB_REDIS_DB: 0
      MAXKB_REDIS_MAX_CONNECTIONS: 100
      MAXKB_SECRET_KEY: ci-django-secret-key
      MAXKB_HMAC_SIGNED_SERIALIZER_SECRET_KEY: ci-hmac-secret-key
      MAXKB_RSA_PASSPHRASE: ci-rsa-passphrase
      MAXKB_DEFAULT_PASSWORD: TestPassword123!
      MAXKB_DEBUG: False
      MAXKB_LOG_DIR: /tmp/maxkb/logs
      MAXKB_CELERY_DATA_DIR: /tmp/maxkb/celery_task
      VITE_API_TARGET: 'http://127.0.0.1:8080'

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install backend dependencies
        run: |
          uv venv .venv
          . .venv/bin/activate
          python - <<'PY' > /tmp/maxkb-requirements.txt
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('pyproject.toml').read_text())
          for dependency in data['project']['dependencies']:
              print(dependency)
          PY
          uv pip install -r /tmp/maxkb-requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p /tmp/maxkb/logs /tmp/maxkb/celery_task

      - name: Enable pgvector for runtime databases
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os
          import psycopg

          common = {
              'host': os.environ['MAXKB_DB_HOST'],
              'port': os.environ['MAXKB_DB_PORT'],
              'user': os.environ['MAXKB_DB_USER'],
              'password': os.environ['MAXKB_DB_PASSWORD'],
          }

          for dbname in ('postgres', 'template1', 'maxkb'):
              with psycopg.connect(dbname=dbname, autocommit=True, **common) as conn:
                  conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY

      - name: Install frontend dependencies
        working-directory: ui
        run: npm install

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: |
          . .venv/bin/activate
          python apps/manage.py migrate

      - name: Start backend server
        id: start-backend
        run: |
          . .venv/bin/activate
          nohup python apps/manage.py runserver 0.0.0.0:8080 >/tmp/maxkb-web.log 2>&1 &
          echo "backend_pid=$!" >> "$GITHUB_OUTPUT"

      - name: Wait for backend readiness
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          log_path = '/tmp/maxkb-web.log'
          max_wait = 120
          interval = 2
          base_url = 'http://127.0.0.1:8080'

          public_health_url = f'{base_url}/admin/api/login/auth/setting'
          protected_app_url = f'{base_url}/admin/api/user/profile'

          waited = 0
          while waited < max_wait:
              public_ready = False
              try:
                  with urllib.request.urlopen(public_health_url, timeout=3) as response:
                      public_ready = response.status == 200
              except Exception:
                  pass

              if public_ready:
                  try:
                      with urllib.request.urlopen(protected_app_url, timeout=3) as response:
                          if response.status in (200, 401):
                              print(f'Backend ready after {waited}s')
                              break
                  except urllib.error.HTTPError as exc:
                      if exc.code == 401:
                          print(f'Backend ready after {waited}s')
                          break
                  except Exception:
                      pass

              time.sleep(interval)
              waited += interval
          else:
              print('=== Backend failed to become ready ===')
              print(f'Timeout after {max_wait}s waiting for {public_health_url}')
              try:
                  with open(log_path, encoding='utf-8', errors='replace') as log_file:
                      lines = log_file.readlines()
                  print('--- Last 80 lines of backend log ---')
                  for line in lines[-80:]:
                      print(line.rstrip())
              except Exception as exc:
                  print(f'Could not read backend log: {exc}')
              raise SystemExit('Backend readiness check failed')
          PY

      - name: Upload backend log on readiness failure
        if: failure() && steps.start-backend.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-log
          path: /tmp/maxkb-web.log
          retention-days: 7

      - name: Run advisory E2E tests
        working-directory: ui
        run: npx playwright test --grep-invert @deferred

      - name: Detect Playwright report output
        if: always()
        run: |
          if [ -d ui/playwright-report ]; then
            echo "playwright_report_exists=true" >> "$GITHUB_ENV"
          else
            echo "playwright_report_exists=false" >> "$GITHUB_ENV"
            echo "Playwright report directory not found; skipping upload."
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && env.playwright_report_exists == 'true'
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
