name: CI

on:
  push:
    branches: [main, master, v2]
  pull_request:
    branches: [main, master, v2]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -r pyproject.toml
          uv pip install pytest pytest-cov pytest-django

      - name: Run backend unit tests
        run: |
          . .venv/bin/activate
          pytest apps/ --cov=apps --cov-report=xml --cov-report=term-missing -v
        env:
          DJANGO_SETTINGS_MODULE: "application.settings"
          DATABASE_URL: "sqlite:///tmp/test.db"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run type-check

      - name: Lint
        working-directory: ui
        run: npm run lint

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maxkb
          POSTGRES_PASSWORD: maxkb123
          POSTGRES_DB: maxkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install backend dependencies
        run: |
          uv venv .venv
          uv pip install -r pyproject.toml
          uv pip install pytest pytest-django

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Run database migrations
        run: |
          . .venv/bin/activate
          python apps/manage.py migrate
        env:
          DATABASE_URL: postgres://maxkb:maxkb123@localhost:5432/maxkb
          REDIS_URL: redis://localhost:6379/0

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test
        env:
          DATABASE_URL: postgres://maxkb:maxkb123@localhost:5432/maxkb
          REDIS_URL: redis://localhost:6379/0
          MAXKB_DEFAULT_PASSWORD: TestPassword123!

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
