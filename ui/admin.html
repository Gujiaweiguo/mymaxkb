<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,  maximum-scale=1.0, minimum-scale=1.0, user-scalable=no,
  viewport-fit=cover"
    />
    <base target="_blank" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      ;((prefix) => {
        window.MaxKB = {
          prefix: '/admin',
          chatPrefix: '/chat',
        }
      })()
    </script>
    <script type="module">
      const normalizedPrefix = window.MaxKB.prefix.endsWith('/')
        ? window.MaxKB.prefix.slice(0, -1)
        : window.MaxKB.prefix
      const pathname = window.location.pathname
      if (pathname === `${normalizedPrefix}/` || pathname === `${normalizedPrefix}/.html`) {
        window.location.replace(`${normalizedPrefix}.html`)
      } else {
        import('/src/main.ts')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
